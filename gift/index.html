<body>

    <!-- ============================================================
       MAIN SCRIPT — логика UTM → WhatsApp
       ============================================================ -->
    <script>
        (function () {
            'use strict';

            // ===== КОНФИГУРАЦИЯ =====
            const CONFIG = {
                phone: '77780878211',
                prefix: 'gt',                     // Префикс для источника gift
                defaultUtm: '1',                  // Если UTM пустой/невалидный → gt1
                messageTemplate: 'Здравствуйте, хочу заказать подарочный набор.',
            };

            // ===== ПРИОРИТЕТ UTM ПАРАМЕТРОВ =====
            // 1. ad_name / adname  — имя объявления TikTok (самый высокий приоритет)
            // 2. utm_content       — часто используется для имени креатива
            // 3. utm               — основной ручной параметр
            // 4. utm_source        — источник трафика (добавлено)
            // 5. campaign_name     — имя кампании (запасной)
            const UTM_PRIORITY = [
                'ad_name',
                'adname',
                'utm_content',
                'utm',
                'utm_source',
                'campaign_name',
            ];

            /**
             * Извлекает значение UTM из URL по приоритету
             * Если значение длиннее 7 символов, возвращает fallback "1"
             */
            function getUtmValue() {
                const params = new URLSearchParams(window.location.search);

                for (const key of UTM_PRIORITY) {
                    const value = params.get(key);
                    if (value && value.trim() !== '') {
                        const trimmedValue = value.trim();
                        // Если значение длиннее 7 символов → fallback на "1"
                        if (trimmedValue.length > 7) {
                            return CONFIG.defaultUtm;
                        }
                        return trimmedValue;
                    }
                }

                return CONFIG.defaultUtm;
            }

            /**
             * Формирует ссылку WhatsApp
             */
            function buildWhatsAppUrl(utmValue) {
                const tag = CONFIG.prefix + utmValue;
                const text = `(${tag}) ${CONFIG.messageTemplate}`;
                const encoded = encodeURIComponent(text);
                return `https://wa.me/${CONFIG.phone}?text=${encoded}`;
            }

            /**
             * Отправляет событие конверсии в TikTok Pixel
             */
            function trackConversion() {
                if (typeof ttq !== 'undefined') {
                    ttq.track('ClickButton');
                    // Также отправляем CompleteRegistration как основное событие конверсии
                    ttq.track('CompleteRegistration');
                }
            }

            // ===== ИНИЦИАЛИЗАЦИЯ =====
            const utmValue = getUtmValue();
            const waUrl = buildWhatsAppUrl(utmValue);
            const btn = document.getElementById('wa-btn');

            if (btn) {
                btn.href = waUrl;

                btn.addEventListener('click', function () {
                    trackConversion();
                });
            }

            // Логирование для отладки (убрать в продакшене если нужно)
            console.log('[GlobalFruit] UTM:', utmValue);
            console.log('[GlobalFruit] WA URL:', waUrl);
        })();
    </script>

</body>
