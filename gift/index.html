<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalFruit Gift - Фруктовые корзины</title>
    <meta name="description" content="Каталог фруктовых корзин GlobalFruit с заказом через WhatsApp.">
    <meta property="og:title" content="GlobalFruit Gift">
    <meta property="og:description" content="Лёгкий каталог фруктовых корзин с заказом через WhatsApp.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://globalfruit.kz/gift">
    <meta property="og:site_name" content="GlobalFruit">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page-shell">
        <header class="hero">
            <div class="hero__copy">
                <p class="hero__eyebrow">GlobalFruit Gift</p>
                <h1 class="hero__title">Фруктовые корзины</h1>
                <p class="hero__lead">
                    Для красивого и вкусного подарка.
                    <br>
                    Выбирайте готовую или закажите на свой вкус. Заказ уйдет в WhatsApp, фото перед отправкой.
                </p>
            </div>

            <div class="hero__visual">
                <img class="hero__portrait" src="./assets/ginger.webp" alt="Девушка с манго в тёплом летнем интерьере">
            </div>
        </header>

        <main class="catalog">
            <div class="catalog-status" id="catalog-status">Загружаю корзины...</div>
            <section class="catalog-list" id="catalog-list" aria-label="Каталог корзин"></section>
        </main>
    </div>

    <button class="cart-fab is-hidden" id="cart-fab" type="button" aria-label="Открыть корзину">
        <span class="cart-fab__label">Корзина</span>
        <span class="cart-fab__meta" id="cart-fab-meta">0</span>
    </button>

    <div class="cart-sheet" id="cart-sheet" aria-hidden="true">
        <div class="cart-sheet__backdrop" id="cart-backdrop"></div>
        <aside class="cart-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="cart-title">
            <div class="cart-sheet__header">
                <div>
                    <p class="cart-sheet__eyebrow">Заказ</p>
                    <h2 class="cart-sheet__title" id="cart-title">Корзина</h2>
                </div>
                <button class="cart-sheet__close" id="cart-close" type="button" aria-label="Закрыть корзину">×</button>
            </div>

            <div class="cart-sheet__body">
                <div class="cart-empty" id="cart-empty">Пока ничего не выбрано.</div>
                <div class="cart-items" id="cart-items"></div>
            </div>

            <div class="cart-sheet__footer">
                <div class="cart-total">
                    <span class="cart-total__label">Итого</span>
                    <strong class="cart-total__value" id="cart-total-price">0 ₸</strong>
                </div>
                <a class="cart-sheet__whatsapp" id="cart-whatsapp" href="https://wa.me/77780878211" target="_blank" rel="noopener">
                    Отправить в WhatsApp
                </a>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>

</html>
